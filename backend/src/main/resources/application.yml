server:
  shutdown: graceful
  port: ${PORT:8080}

spring:
  config:
    # Loads backend/.env as a properties file for local development.
    # The 'optional:' prefix means Spring Boot silently skips this if the file
    # does not exist (e.g. on Render, where env vars are injected by the platform).
    # The '[.properties]' suffix tells Spring Boot to parse it as KEY=VALUE format.
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql

app:
  clerk:
    # Clerk Dashboard → API Keys → "JWKS URL". Must belong to the SAME Clerk instance
    # as the frontend's VITE_CLERK_PUBLISHABLE_KEY, otherwise every request is a 401.
    jwks-uri: ${CLERK_JWKS_URI}

  cors:
    # Comma-separated. Also used as the allowed origins for both WebSocket endpoints.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://collab-code-application.vercel.app}

  gemini:
    # Loaded from GEMINI_API_KEY (backend/.env locally, Render env var in production).
    # NEVER expose this to the frontend. No VITE_ equivalent should ever exist.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}

  yjs:
    # How often changed documents are persisted to the database.
    flush-interval-ms: ${YJS_FLUSH_INTERVAL_MS:60000}

  rate-limit:
    execute-per-minute: ${RATE_LIMIT_EXECUTE_PER_MINUTE:20}
    agent-per-minute: ${RATE_LIMIT_AGENT_PER_MINUTE:6}
